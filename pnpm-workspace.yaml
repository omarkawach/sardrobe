packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  "@sentry/cli": true
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: true
  workerd: true

catalog:
  # Storybook
  '@astrojs/check': ^0.9.12
  '@astrojs/react': ^6.0.6

  # Testing
  '@axe-core/playwright': ^4.14.0
  '@base-ui/react': ~1.9.0
  '@chromatic-com/storybook': ^5.6.0
  '@playwright/test': ^1.65.1

  # Observability
  '@sentry/astro': ^10.78.0
  '@sentry/cloudflare': ^10.78.0
  '@storybook/addon-a11y': ^10.6.8
  '@storybook/addon-docs': ^10.6.8
  '@storybook/addon-vitest': ^10.6.8
  '@storybook/react': ^10.6.8
  '@storybook/react-vite': ^10.6.8

  # Build tooling
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitest/browser-playwright': ^4.1.12
  '@vitest/coverage-v8': ^4.1.12
  '@vitest/mocker': ^4.1.12
  esbuild: ^0.28.2

  # Frontend
  astro: ^7.4.13

  # Backend
  hono: ^4.13.19
  playwright: ^1.65.1
  react: ^19.3.1
  react-dom: ^19.3.1
  storybook: ^10.6.8
  tsup: ^8.5.1
  typescript: ^6.0.3
  vite: ^8.3.8
  vitest: ^4.1.12
overrides:
  "@cloudflare/workers-types": 5.20261121.1
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  "@huggingface/transformers>sharp": 0.35.5
  onnxruntime-node>adm-zip: 0.6.1
  tsup>esbuild: 0.28.2
  # Keep transitive Storybook/Sentry glob usage on the patched cancellation implementation.
  "glob@>=9 <14.0.2": 14.0.2
